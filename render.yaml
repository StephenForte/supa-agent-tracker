# Phase 0 static demo. No environment variables, secrets, databases, or paid plans.
# Node 24 is selected from the repo-root .node-version file. See docs/deploy.md.
previews:
  generation: off

services:
  - type: web
    name: supa-agent-tracker
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  # Phase 1 web service. Paid. Merging this file onto main provisions it. See docs/ops/deploy-phase1.md.
  - type: web
    name: supa-agent-tracker-app
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    previews:
      generation: off
    buildCommand: npm ci --include=dev && VITE_DATA_SOURCE=http npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: supa-agent-tracker-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://supa-agent-tracker-app.onrender.com
      - key: TRUST_PROXY_HOPS
        # Measured 2026-10-16: Render puts two proxy hops in front of the app. With 1, request.ip rotated per request
        # and the per-IP sign-in limit never engaged; with 2 it engages and spoofed X-Forwarded-For does not bypass it.
        value: "2"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: REGISTRATION_ALLOWLIST
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: supa-agent-tracker-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    # 1 GB is included in the plan; Render's default (15 GB) bills 14 GB extra at $0.30/GB-month.
    diskSizeGB: 1
    ipAllowList: []
