# Phase 0 static demo. No environment variables, secrets, databases, or paid plans.
# Node 24 is selected from the repo-root .node-version file. See docs/deploy.md.
previews:
  generation: off

services:
  - type: web
    name: supa-agent-tracker
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    previews:
      generation: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
