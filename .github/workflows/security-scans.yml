name: Security & Vulnerability Scans

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  semgrep-sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      # semgrep ci exits 0 when it cannot log in, so a missing token would pass silently.
      - name: Require Semgrep token
        run: test -n "$SEMGREP_APP_TOKEN" || { echo "::error::SEMGREP_APP_TOKEN secret is missing or empty"; exit 1; }
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Run Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  trivy-sca:
    name: Trivy Dependency & Misconfig Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # trivy-action caches $GITHUB_WORKSPACE/.cache/trivy and sets
      # TRIVY_CACHE_DIR there. A separate cache of ~/.cache/trivy never
      # reaches the directory the scan reads.
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true